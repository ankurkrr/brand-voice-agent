<!-- Brand Voice Profile Section -->
<div style="margin-bottom:2rem; padding-bottom:2rem; border-bottom:1px solid var(--border-color);">

            <div id="preview-stats"></div>

    <div class="input-group" style="margin-top: 1rem;">

    </div>

    <!-- Rest of existing fields remain the same -->
    <div class="input-group">
        <label>Do's (Writing Rules) *</label>
        <textarea id="dos" placeholder="One rule per line (at least 1 required)"></textarea>
        <div class="helper-text">Required - At least one writing rule</div>

    <div class="input-group">

    <div class="input-group">

</div>


<!--
====================================================================
STEP 2: Add JavaScript for Persona Loading
Add this code AFTER the existing JavaScript (before </script> tag):
====================================================================
-->
<script>
    let personas = [];

    // Load personas on page load
    async function loadPersonasList() {
        const brandId = new URLSearchParams(window.location.search).get('brand_id') || 'default-brand';
        try {
            const res = await fetch(`/api/personas/brand/${brandId}`);
            if (!res.ok) return;
            const data = await res.json();
            personas = data.personas || [];

            const selector = document.getElementById('persona-selector');
            selector.innerHTML = '<option value="">-- Select a Persona --</option>' +
                personas.map(p => `<option value="${p.persona_id}">${p.persona_name}</option>`).join('');
        } catch (err) {
            console.error('Failed to load personas', err);
        }
    }

    async function loadPersona() {
        const personaId = document.getElementById('persona-selector').value;
        if (!personaId) {
            document.getElementById('resolved-preview').style.display = 'none';
            return;
        }

        try {
            // Fetch resolved persona (with inheritance)
            const res = await fetch(`/api/personas/${personaId}/resolve`);
            if (!res.ok) throw new Error('Failed to load persona');
            const resolved = await res.json();

            // Auto-fill form
            document.getElementById('profile_id').value = resolved.persona_id;
            document.getElementById('dos').value = resolved.explicit_rules.dos.join('\n');
            document.getElementById('donts').value = resolved.explicit_rules.donts.join('\n');
            document.getElementById('forbidden_phrases').value = resolved.explicit_rules.forbidden_phrases.join(', ');
            document.getElementById('preferred_vocab').value = (resolved.explicit_rules.preferred_vocabulary || []).join(', ');

            // Show resolved preview
            document.getElementById('preview-stats').innerHTML = `
            Total Forbidden Phrases: <strong style="color:var(--primary-color);">${resolved.explicit_rules.forbidden_phrases.length}</strong><br>
            DOs: <strong style="color:var(--primary-color);">${resolved.explicit_rules.dos.length}</strong> | 
            DON'Ts: <strong style="color:var(--primary-color);">${resolved.explicit_rules.donts.length}</strong>
        `;

            if (resolved.inheritance_chain && resolved.inheritance_chain.length > 1) {
                document.getElementById('preview-inheritance').innerHTML = `
                <span style="color:var(--secondary-color);">📊 Inherited from ${resolved.inheritance_chain.length - 1} parent persona(s)</span>
            `;
            } else {
                document.getElementById('preview-inheritance').innerHTML = '';
            }

            document.getElementById('resolved-preview').style.display = 'block';

        } catch (err) {
            alert('Error loading persona: ' + err.message);
        }
    }

    // Load personas when page loads
    window.addEventListener('DOMContentLoaded', loadPersonasList);
</script>
