<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Management - Brand Voice & Persona Ingestion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-link {
            color: #666;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link:hover {
            color: #fff;
            background: #222;
        }

        .view-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #111;
            padding: 0.5rem;
            border-radius: 8px;
            width: fit-content;
        }

        .toggle-btn {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .toggle-btn.active {
            background: #222;
            color: #03dac6;
        }

        .btn-create {
            background: #fff;
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-create:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        .personas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .persona-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .persona-card:hover {
            transform: translateY(-4px);
            border-color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .persona-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .persona-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #222;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #03dac6;
        }

        .persona-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: #222;
            color: #fff;
        }

        .dimensional-scores {
            margin: 1rem 0;
            padding: 1rem;
            background: #0a0a0a;
            border-radius: 8px;
        }

        .score-bar {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .score-label {
            width: 100px;
            font-size: 0.85rem;
            color: #888;
        }

        .score-track {
            flex: 1;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #03dac6, #bb86fc);
            transition: width 0.3s;
        }

        .score-value {
            width: 40px;
            text-align: right;
            font-size: 0.85rem;
            color: #03dac6;
        }

        .persona-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #222;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #03dac6;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.25rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #111;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 1rem;
            background: #080808;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #03dac6;
            background: #0a0a0a;
            box-shadow: 0 0 0 2px rgba(3, 218, 198, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-secondary {
            background: #222;
            color: #fff;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background: #333;
        }

        .hierarchy-tree {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 2rem;
            display: none;
        }

        .hierarchy-tree.active {
            display: block;
        }

        .tree-node {
            padding: 1rem;
            margin-left: 0;
            position: relative;
        }

        .tree-node.child {
            margin-left: 40px;
            padding-left: 1.5rem;
            border-left: 2px solid #333;
        }

        .tree-node.child::before {
            content: "└─";
            position: absolute;
            left: 0;
            color: #666;
        }

        .tree-node-content {
            background: #0a0a0a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #222;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tree-node-content:hover {
            border-color: #03dac6;
            background: #111;
        }

        .tree-node-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .tree-node-subtitle {
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Persona Management</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">← Voice Ingestion</a>
                <a href="/execution" class="nav-link">Content Generator →</a>
            </div>
        </header>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div class="view-toggle">
                <button class="toggle-btn active" onclick="setView('grid')">Grid View</button>
                <button class="toggle-btn" onclick="setView('tree')">Hierarchy View</button>
            </div>
            <button class="btn-create" onclick="openCreateModal()">+ Create Persona</button>
        </div>

        <div id="grid-view" class="personas-grid"></div>
        <div id="tree-view" class="hierarchy-tree"></div>

        <div id="persona-modal" class="modal">
            <div class="modal-content">
                <h2 id="modal-title" style="margin-bottom: 1.5rem;">Create New Persona</h2>

                <div class="form-group">
                    <label class="form-label">Persona Name *</label>
                    <input type="text" id="persona-name" placeholder="e.g., CEO Style, Marketing Team" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Parent Persona (Optional)</label>
                    <select id="parent-persona">
                        <option value="">None (Root Persona)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Primary Tone</label>
                    <select id="primary-tone">
                        <option value="Professional">Professional</option>
                        <option value="Friendly">Friendly</option>
                        <option value="Authoritative">Authoritative</option>
                        <option value="Casual">Casual</option>
                        <option value="Informative">Informative</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">DOs (one per line)</label>
                    <textarea id="dos" placeholder="Use active voice&#10;Be concise&#10;Use examples"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">DON'Ts (one per line)</label>
                    <textarea id="donts" placeholder="Avoid jargon&#10;No passive voice&#10;Don't be vague"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Forbidden Phrases (one per line)</label>
                    <textarea id="forbidden-phrases" placeholder="synergy&#10;leverage&#10;utilize"></textarea>
                </div>

                <div class="modal-actions">
                    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn-create" onclick="savePersona()">Create Persona</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let personas = [];
        let currentView = 'grid';
        let brandId = new URLSearchParams(window.location.search).get('brand_id') || 'default-brand';

        async function loadPersonas() {
            try {
                const res = await fetch(`/api/personas/brand/${brandId}`);
                if (!res.ok) throw new Error('Failed to load personas');
                const data = await res.json();
                personas = data.personas || [];
                renderView();
            } catch (err) {
                console.error(err);
                document.getElementById('grid-view').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 3rem;">No personas yet. Create your first one!</div>';
            }
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderView();
        }

        function renderView() {
            if (currentView === 'grid') {
                renderGridView();
            } else {
                renderTreeView();
            }
        }

        function renderGridView() {
            const grid = document.getElementById('grid-view');
            const tree = document.getElementById('tree-view');

            grid.style.display = 'grid';
            tree.classList.remove('active');

            if (personas.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 3rem;">No personas yet. Create your first one!</div>';
                return;
            }

            grid.innerHTML = personas.map(persona => `
                <div class="persona-card">
                    <div class="persona-header">
                        <div>
                            <div class="persona-name">${persona.persona_name}</div>
                            ${persona.parent_persona_id ? '<span class="badge">Child Persona</span>' : '<span class="badge">Root</span>'}
                        </div>
                        <div class="persona-actions">
                            <button class="btn-icon" onclick="editPersona('${persona.persona_id}')" title="Edit">✏️</button>
                            <button class="btn-icon" onclick="deletePersona('${persona.persona_id}')" title="Delete">🗑️</button>
                        </div>
                    </div>

                    ${persona.dimensional_scores ? renderDimensionalScores(persona.dimensional_scores) : ''}

                    <div class="persona-stats">
                        <div class="stat">
                            <div class="stat-value">${(persona.explicit_rules?.forbidden_phrases || []).length}</div>
                            <div class="stat-label">Forbidden</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${(persona.explicit_rules?.dos || []).length}</div>
                            <div class="stat-label">DOs</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${(persona.explicit_rules?.donts || []).length}</div>
                            <div class="stat-label">DON'Ts</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderDimensionalScores(scores) {
            const dimensions = ['Humor', 'Empathy', 'Authority', 'Formality', 'Enthusiasm'];
            return `
                <div class="dimensional-scores">
                    ${dimensions.map(dim => `
                        <div class="score-bar">
                            <div class="score-label">${dim}</div>
                            <div class="score-track">
                                <div class="score-fill" style="width: ${(scores[dim] || 0) * 100}%"></div>
                            </div>
                            <div class="score-value">${((scores[dim] || 0) * 100).toFixed(0)}%</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderTreeView() {
            const grid = document.getElementById('grid-view');
            const tree = document.getElementById('tree-view');

            grid.style.display = 'none';
            tree.classList.add('active');

            const rootPersonas = personas.filter(p => !p.parent_persona_id);
            const childrenMap = personas.reduce((map, p) => {
                if (p.parent_persona_id) {
                    if (!map[p.parent_persona_id]) map[p.parent_persona_id] = [];
                    map[p.parent_persona_id].push(p);
                }
                return map;
            }, {});

            function renderNode(persona, isChild = false) {
                const children = childrenMap[persona.persona_id] || [];
                return `
                    <div class="tree-node ${isChild ? 'child' : ''}">
                        <div class="tree-node-content">
                            <div class="tree-node-title">${persona.persona_name}</div>
                            <div class="tree-node-subtitle">
                                ${(persona.explicit_rules?.forbidden_phrases || []).length} forbidden phrases
                                ${persona.parent_persona_id ? ' • Inherits from parent' : ''}
                            </div>
                        </div>
                        ${children.map(child => renderNode(child, true)).join('')}
                    </div>
                `;
            }

            tree.innerHTML = rootPersonas.map(root => renderNode(root)).join('');
        }

        function openCreateModal() {
            document.getElementById('modal-title').textContent = 'Create New Persona';
            document.getElementById('persona-modal').classList.add('active');

            const parentSelect = document.getElementById('parent-persona');
            parentSelect.innerHTML = '<option value="">None (Root Persona)</option>' +
                personas.map(p => `<option value="${p.persona_id}">${p.persona_name}</option>`).join('');
        }

        function closeModal() {
            document.getElementById('persona-modal').classList.remove('active');
            document.getElementById('persona-name').value = '';
            document.getElementById('parent-persona').value = '';
            document.getElementById('dos').value = '';
            document.getElementById('donts').value = '';
            document.getElementById('forbidden-phrases').value = '';
        }

        async function savePersona() {
            const name = document.getElementById('persona-name').value.trim();
            const parentId = document.getElementById('parent-persona').value;
            const tone = document.getElementById('primary-tone').value;
            const dos = document.getElementById('dos').value.split('\n').map(s => s.trim()).filter(s => s);
            const donts = document.getElementById('donts').value.split('\n').map(s => s.trim()).filter(s => s);
            const forbiddenPhrases = document.getElementById('forbidden-phrases').value.split('\n').map(s => s.trim()).filter(s => s);

            if (!name) {
                alert('Persona name is required');
                return;
            }

            const payload = {
                persona_name: name,
                brand_id: brandId,
                parent_persona_id: parentId || null,
                explicit_rules: {
                    tone: { primary: tone, secondary: [], description: '' },
                    dos: dos,
                    donts: donts,
                    forbidden_phrases: forbiddenPhrases,
                    preferred_vocabulary: []
                }
            };

            try {
                const res = await fetch('/api/personas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Failed to create persona');
                }

                alert('Persona created successfully!');
                closeModal();
                await loadPersonas();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function deletePersona(personaId) {
            if (!confirm('Are you sure you want to delete this persona?')) return;

            try {
                const res = await fetch(`/api/personas/${personaId}`, { method: 'DELETE' });
                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.detail || 'Failed to delete persona');
                }
                alert('Persona deleted successfully!');
                await loadPersonas();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function editPersona(personaId) {
            alert('Edit functionality coming soon! Persona ID: ' + personaId);
        }

        loadPersonas();
    </script>
</body>

</html>
